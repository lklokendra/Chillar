server:
  # 8080 is held by Oracle's TNSLSNR listener on this machine.
  port: 8081

spring:
  application:
    name: paise-backend

  datasource:
    url: ${COIN_DB_URL:jdbc:postgresql://localhost:5433/coin}
    username: ${COIN_DB_USERNAME:coin}
    password: ${COIN_DB_PASSWORD:coin}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

coin:
  jwt:
    # Override in production: must be at least 32 bytes for HS256.
    secret: ${COIN_JWT_SECRET:coin-dev-only-secret-change-me-32-bytes-min}
    # Ordinary visit: 24 hours.
    expiration-minutes: ${COIN_JWT_EXPIRATION_MINUTES:1440}
    # "Remember me" on this browser: 30 days.
    remember-me-expiration-minutes: ${COIN_JWT_REMEMBER_ME_EXPIRATION_MINUTES:43200}
  cors:
    allowed-origins: ${COIN_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  password-reset:
    expiration-minutes: ${COIN_PASSWORD_RESET_EXPIRATION_MINUTES:30}
  auth:
    rate-limit:
      # Per client address, per endpoint, per window.
      max-attempts: ${COIN_AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${COIN_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    org.springframework.security: INFO
