<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paise - a minimal personal finance tracker" />
    <title>Paise | Finance Tracker</title>

    <!-- Brand icons. The favicon follows the operating-system appearance, which
         is the only signal a browser exposes for tab icons. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-light.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)" />

    <script>
      // Applies the saved theme before the first paint, so a returning dark-mode
      // visitor never sees a white flash. Mirrors resolveTheme() in ThemeContext.
      (function () {
        try {
          var stored = window.localStorage.getItem('paise.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
